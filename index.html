

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Car Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06172a;color:white;font-family:Arial;text-align:center}
header{padding:18px 5px;color:#00d9ff;font-size:clamp(22px,5vw,42px);font-weight:900;font-style:italic;text-shadow:0 0 12px #00cfff}
.stats{display:flex;justify-content:space-around;background:#031322;border:1px solid #00cfff;border-radius:16px;padding:15px;font-size:clamp(15px,3vw,24px);font-weight:bold}
#game{height:65vh;min-height:360px;max-height:620px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#104b27 0 35px,#15552d 35px 70px)}
.road{position:absolute;inset:0 15%;background:#172231;border-left:8px solid #626b76;border-right:8px solid #626b76}
.road:after{content:"";position:absolute;inset:0 33%;border-left:4px dashed #89909a;border-right:4px dashed #89909a}
.car{position:absolute;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);width:54px;height:90px;background:linear-gradient(90deg,#0056a8,#00aaff,#003c80);border:3px solid #009dff;border-radius:16px 16px 8px 8px;box-shadow:0 0 12px #008cff}
.car:before{content:"";position:absolute;top:15px;left:9px;width:30px;height:28px;background:#071a2b;border:2px solid #3f779a;border-radius:8px}
#traffic{position:absolute;z-index:3;top:80px;left:50%;transform:translateX(-50%);font-size:50px}
#over{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06132288;font-size:30px;font-weight:900}
#over small{font-size:16px;color:#aeeaff;margin-top:10px}
.controls{display:flex;justify-content:space-around;gap:12px;padding:20px}
button{border:3px solid #00d9ff;border-radius:22px;padding:14px 25px;font-size:20px;font-weight:bold;cursor:pointer;background:#087be9;color:white}
button.restart{background:#ffcc00;color:#111;border-color:white}
</style>
</head>
<body>
<header>🏁 ULTIMATE CAR RACING 🏁</header>
<div class="stats"><span>Score: <b id="score">0</b></span><span>Speed: <b id="speed">5</b></span><span>Best: <b id="best">0</b></span></div>
<div id="game">
<div class="road"></div>
<div id="traffic">🚙</div>
<div class="car" id="car"></div>
<div id="over">READY TO RACE!<small>Press RESTART to play</small></div>
</div>
<div class="controls">
<button id="left">⬅ LEFT</button>
<button class="restart" id="restart">RESTART</button>
<button id="right">RIGHT ➡</button>
</div>
<script>
const car=document.getElementById('car'),traffic=document.getElementById('traffic'),over=document.getElementById('over'),game=document.getElementById('game');
let lane=1,score=0,running=false,y=80,timer=null,best=0;
try{best=Number(localStorage.getItem('racingBest'))||0}catch(e){}
document.getElementById('best').textContent=best;
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));car.style.left=(25+lane*25)+'%'}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1)});
function end(){running=false;clearInterval(timer);over.style.display='flex';over.innerHTML='GAME OVER<small>Press RESTART to play again</small>';if(score>best){best=score;try{localStorage.setItem('racingBest',best)}catch(e){}document.getElementById('best').textContent=best}}
function tick(){if(!running)return;y+=5+Math.min(score/100,8);if(y>game.clientHeight){y=-65;traffic.textContent=['🚙','🚕','🚗','🚚'][Math.floor(Math.random()*4)];traffic.style.left=(25+Math.floor(Math.random()*3)*25)+'%'}traffic.style.top=y+'px';score++;document.getElementById('score').textContent=score;document.getElementById('speed').textContent=5+Math.floor(score/100);const a=traffic.getBoundingClientRect(),b=car.getBoundingClientRect();if(a.bottom>b.top+5&&a.top<b.bottom-5&&a.right>b.left+5&&a.left<b.right-5)end()}
document.getElementById('restart').onclick=()=>{clearInterval(timer);lane=1;score=0;y=80;traffic.style.left='50%';car.style.left='50%';traffic.textContent='🚙';document.getElementById('score').textContent='0';document.getElementById('speed').textContent='5';over.style.display='none';running=true;timer=setInterval(tick,70)};
</script>
</body>
</html>
